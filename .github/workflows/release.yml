# Publishes a release when a version tag is pushed - "1.2.3" (or "v1.2.3",
# or the full four-part "1.2.3.0"; the plugin's four-part version comes from
# build.yaml and must agree with the tag):
#   1. builds the plugin and zips the DLL as jellycanvas_<version>.zip,
#   2. creates the GitHub release with the zip attached,
#   3. adds the version to manifest.json on main, so every Jellyfin server
#      that has this repository added sees the update in its catalog.
name: Release

on:
  push:
    tags: ["[0-9]*", "v[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from build.yaml, checked against the tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME#v}"
          yaml=$(sed -n 's/^version: *"\([0-9.]*\)"/\1/p' build.yaml)
          # a three-part tag stands for the four-part version with a trailing .0
          if [ "$tag" != "$yaml" ] && [ "$tag.0" != "$yaml" ]; then
            echo "tag $GITHUB_REF_NAME does not match build.yaml version $yaml" >&2
            exit 1
          fi
          echo "version=$yaml" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release

      - name: Package
        id: pkg
        run: |
          version="${{ steps.ver.outputs.version }}"
          mkdir -p dist/pkg
          cp Jellyfin.Plugin.Jellycanvas/bin/Release/net10.0/Jellyfin.Plugin.Jellycanvas.dll dist/pkg/
          (cd dist/pkg && zip -q "../jellycanvas_${version}.zip" *)
          echo "zip=dist/jellycanvas_${version}.zip" >> "$GITHUB_OUTPUT"
          echo "asset=jellycanvas_${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'EOF' > dist/notes.md
          import re, pathlib, os
          version = "${{ steps.ver.outputs.version }}"
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## {re.escape(version)}\b[^\n]*\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else f"Version {version}.")
          EOF

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Jellycanvas ${{ steps.ver.outputs.version }}
          body_path: dist/notes.md
          files: ${{ steps.pkg.outputs.zip }}

      - name: Update manifest.json on main
        run: |
          version="${{ steps.ver.outputs.version }}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.pkg.outputs.asset }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          python3 scripts/update-manifest.py --version "$version" --zip "${{ steps.pkg.outputs.zip }}" --url "$url"
          git add manifest.json
          git commit -m "manifest: add ${version}"
          git push origin main
