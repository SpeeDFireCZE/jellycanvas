targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Visual theme builder - customize the Jellyfin web UI without writing CSS"
description: >
  Jellycanvas adds a theme designer to the dashboard: pick colors, bar styles
  (solid, glass, gradient), rounding, card effects and fonts, see a live
  preview for web, TV and mobile layouts, and apply. The result is plain CSS
  written to Dashboard > Branding > Custom CSS, so nothing else in Jellyfin
  is touched.
