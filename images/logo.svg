    <path d="M0 -1 C-9 5 -10 12 -7 16 L7 16 C9 10 7 4 0 -1 Z" fill="#e6d3ad" stroke="#2f3442" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M0 -1 C-9 5 -10 12 -8.4 14.5 Q0 9 8 12 C8 7 6 3 0 -1 Z" fill="url(#paint)" stroke="#2f3442" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
</svg>
